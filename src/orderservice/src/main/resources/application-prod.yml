spring:
  application:
    name: order-service
    version: 1.0.0

  cloud:
    config:
      # Production Config Server
      uri: https://config-server.production.com:8085
      # Fails aplikasyon başlangıcı, config import başarısız olursa
      fail-fast: true
      # Retry konfigürasyonu
      retry:
        max-attempts: 3
        initial-interval: 1000
        max-interval: 3000
        multiplier: 1.1

    # Kafka Configuration
    stream:
      kafka:
        binder:
          # Production Kafka Broker Cluster
          brokers: kafka-1:9092,kafka-2:9092,kafka-3:9092
          # Replication Factor
          replication-factor: 3
          # Min in-sync replicas -> tüm replikalara yazılması gerekli
          min-in-sync-replicas: 2
          # Bağlantı timeout
          socket-receive-buffer-bytes: 102400
          socket-send-buffer-bytes: 102400

        # Producer Bindings
        bindings:
          submitOrder-out-0:
            producer:
              configuration:
                # Idempotency -> Duplicate message Prevention
                enable.idempotance: true
                # Require acknowledgment from all replicas
                acks: all
                # Retry attempts for failed messages
                retries: 5
                # Exponential backoff
                retry.backoff.ms: 100
                # Compression
                compression.type: snappy
                # Batching
                linger.ms: 100
                batch.size: 32768
                # Transaction support (Exactly-once semantics)
                transactional.id: ${spring.application.name}-${HOSTNAME:unknown}
                # Max bytes
                buffer.memory: 67108864
                # TLS Configuration (if needed)
                # security.protocol: SSL
                # ssl.truststore.location: /etc/ssl/truststore.jks
                # ssl.truststore.password: ${SSL_TRUSTSTORE_PASSWORD}

      # Consumer Bindings
      bindings:
        submitOrder-out-0:
          destination: order_topic
          # Partition tuning
          producer:
            partition-key-expression: headers['orderId']

        orderSubmitFailed-in-0:
          destination: order_failed_topic
          group: order_failed_group
          consumer:
            # Parallelism
            concurrency: 5
            # Error handling
            max-attempts: 3
            back-off-initial-interval: 1000
            back-off-max-interval: 10000
            back-off-multiplier: 2.0
            # Isolation level (read_committed -> exactly-once)
            configuration:
              isolation.level: read_committed
              auto.offset.reset: earliest
              session.timeout.ms: 30000

    # Load Balancer Configuration
    loadbalancer:
      ribbon:
        enabled: false
      cache:
        ttl: 35000

    # Eureka Service Discovery
    client:
      enabled: true
      register-with-eureka: true
      fetch-registry: true
      registry-fetch-interval-seconds: 30
      instance-info-replication-interval-seconds: 30
      # Multiple Eureka Servers (HA Eureka)
      service-url:
        defaultZone: https://eureka-1.production.com:8761/eureka/,https://eureka-2.production.com:8761/eureka/,https://eureka-3.production.com:8761/eureka/

  # Spring Cloud Function (Kafka Stream Function)
  cloud:
    function:
      definition: orderSubmitFailed

  # Spring Boot Admin
  boot:
    admin:
      client:
        enabled: true
        # Production Admin Server
        url: https://admin-server.production.com:8081
        instance:
          name: ${spring.application.name}
          prefer-ip-address: false
          metadata-map:
            version: ${spring.application.version}
            environment: production

  # JPA/Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQL13Dialect
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true

  # DataSource Configuration (if needed)
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: "SELECT 1"
      auto-commit: true
      data-source-class-name: org.postgresql.ds.PGSimpleDataSource

# Server Configuration
server:
  port: 5001
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
  tomcat:
    threads:
      max: 200
      min-spare: 10
    accept-count: 100
    connection-timeout: 20000ms
    max-connections: 10000

# Eureka Client Configuration
eureka:
  instance:
    # Use hostname instead of IP
    prefer-ip-address: false
    # Heartbeat tuning
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
    # Health check
    health-check-url-path: /actuator/health
    status-page-url: https://${spring.application.name}.production.com:${server.port}/actuator/info
    home-page-url: https://${spring.application.name}.production.com:${server.port}/
    # Environment label
    metadata-map:
      environment: production
      version: ${spring.application.version}

  client:
    # Eureka client configuration
    availability-zones: zone1,zone2
    change-event-poll-interval-seconds: 30
    disable-delta: false

# Resilience4j Configuration (for Product Service calls)
resilience4j:
  circuitbreaker:
    instances:
      product-service:
        register-health-indicator: true
        # Sliding window configuration
        sliding-window-size: 20
        minimum-number-of-calls: 10
        # Failure threshold
        failure-rate-threshold: 50
        slowness detection
        slow-call-duration-threshold: 3000
        slow-call-rate-threshold: 80
        # Circuit breaker state management
        permitted-number-of-calls-in-half-open-state: 5
        wait-duration-in-open-state: 120s
        # Automatic transition (Half-open -> Closed)
        automatic-transition-from-open-to-half-open-enabled: true
        # Recording exceptions
        record-exceptions:
          - java.util.concurrent.TimeoutException
          - feign.FeignException.ServiceUnavailable
          - feign.FeignException.GatewayTimeout
          - java.net.ConnectException
          - java.net.SocketTimeoutException
        ignore-exceptions:
          - com.mertalptekin.orderservice.exception.BusinessException

  retry:
    instances:
      product-service:
        max-attempts: 3
        wait-duration: 1000
        retry-exceptions:
          - java.util.concurrent.TimeoutException
          - feign.FeignException

  timelimiter:
    instances:
      product-service:
        timeout-duration: 5s
        cancel-running-future: true

# OpenFeign Configuration
feign:
  client:
    config:
      product-service:
        # Connection & Read Timeout
        connect-timeout: 5000
        read-timeout: 10000
        # Logger level
        logger-level: FULL
        # Retryer configuration
        # retryer: com.github.openfeign.Retryer.Default
        # Error decoder
        error-decoder: com.mertalptekin.orderservice.config.CustomErrorDecoder

  # CircuitBreaker integration
  circuitbreaker:
    enabled: true
    alphanumeric-ids:
      enabled: true

# Management & Monitoring
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers,health-endpoint,heap-dump
        exclude: env,configprops,configproperties
      path-mapping:
        health: health-check

  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true
      roles: [ROLE_ADMIN]

  # Health checks
  health:
    circuitbreakers:
      enabled: true
    diskspace:
      enabled: true
      threshold: 1GB
    db:
      enabled: true
    kafka:
      enabled: true
    livenessState:
      enabled: true
    readinessState:
      enabled: true

  # Metrics (Prometheus)
  metrics:
    enable:
      jvm: true
      process: true
      system: true
      logback: true
      tomcat: true
      cache: true
    export:
      prometheus:
        enabled: true
        step: 1m
    tags:
      application: ${spring.application.name}
      environment: production
      version: ${spring.application.version}

  # Tracing Configuration (Zipkin)
  tracing:
    sampling:
      # Production sampling rate: 5%
      probability: 0.05

  zipkin:
    tracing:
      # Production Zipkin Server
      endpoint: https://zipkin.production.com/api/v2/spans
      timeout: 10s
      connect-timeout: 5s
    metrics:
      export:
        enabled: true

# Logging Configuration
logging:
  level:
    root: WARN
    com.mertalptekin.orderservice: INFO
    org.springframework.cloud: INFO
    org.springframework.web: WARN
    org.springframework.kafka: WARN
    org.springframework.cloud.openfeign: DEBUG
    org.hibernate.SQL: WARN
    # feign.Logger: DEBUG # Uncomment for detailed Feign logs

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n [%X{traceId}]"

  file:
    name: /var/log/order-service/order-service.log
    max-size: 100MB
    max-history: 30
    total-size-cap: 1GB

  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 1GB

# Application-specific Configuration
application:
  version: ${spring.application.version}
  environment: production
  features:
    circuit-breaker: enabled
    distributed-tracing: enabled
    kafka-events: enabled

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

